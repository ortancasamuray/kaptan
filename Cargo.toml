[package]
name = "kaptan"
version = "0.1.0"
edition = "2021"
description = "Linux system optimizer and monitor (Rust port of Stacer)"
license = "GPL-3.0-or-later"

[dependencies]
slint = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
strip = true
